<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tic-Tac-Toe — Made by Sandip Rai</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#243b64,#0b1220 70%);font-family:system-ui,Arial;color:#f4f7ff;display:flex;justify-content:center;align-items:center;padding:18px}
.app{width:min(100%,440px);text-align:center}.tag{color:#72e3ff;font-weight:800;letter-spacing:2px;font-size:12px}.title{font-size:clamp(30px,8vw,42px);font-weight:900;margin:6px 0}.sub{color:#bdc9df;margin:0 0 20px}.panel{background:#17243a;border:1px solid #334765;border-radius:20px;padding:16px;box-shadow:0 18px 50px #0005}.score{display:flex;justify-content:space-between;gap:8px;margin-bottom:14px}.pill{background:#253650;border-radius:12px;padding:9px 12px;font-size:13px;flex:1}.pill b{display:block;font-size:20px}.status{font-weight:750;min-height:28px;margin:8px 0 14px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.cell{aspect-ratio:1;background:#243751;border:1px solid #3c5678;border-radius:15px;font-size:clamp(42px,13vw,60px);font-weight:900;color:#72e3ff;display:grid;place-items:center;touch-action:manipulation;cursor:pointer;transition:transform .12s,background .12s}.cell:active{transform:scale(.96)}.cell.o{color:#ffb86b}.cell:disabled{cursor:default}.cell.win{background:#245a58;border-color:#62f5c5}.actions{display:flex;gap:10px;margin-top:14px}.btn{border:0;border-radius:12px;padding:13px 10px;font-weight:800;font-size:14px;cursor:pointer;flex:1}.primary{background:#72e3ff;color:#0b1726}.secondary{background:#2a3c58;color:#f4f7ff;border:1px solid #425879}.settings{display:flex;gap:10px;margin-top:12px;align-items:center}.settings label{font-size:13px;color:#cbd7e9;text-align:left;flex:1}.settings select{background:#243751;color:white;border:1px solid #425879;border-radius:10px;padding:10px;max-width:58%}.note{font-size:12px;color:#9fb0ca;margin:15px 0 0;line-height:1.5}
</style>
<style>
#introScreen{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;transition:opacity .9s ease;opacity:1;padding:24px}
#introCredit{font-family:system-ui,Arial,sans-serif;font-size:clamp(22px,6vw,34px);font-weight:800;letter-spacing:2px;animation:creditGlow 1.5s ease-in-out infinite alternate}
#introSmall{font:12px system-ui,Arial,sans-serif;color:#9aa4b2;letter-spacing:4px;margin-top:14px}
#introScreen.hide{opacity:0;pointer-events:none}
@keyframes creditGlow{from{opacity:.65;transform:scale(.98);text-shadow:0 0 4px #fff}to{opacity:1;transform:scale(1);text-shadow:0 0 18px #72e3ff}}
</style>
<div id="introScreen" aria-label="Game intro"><div id="introCredit">MADE BY SANDIP RAI</div><div id="introSmall">PRESENTS</div></div>
<script>
(()=>{const intro=document.getElementById('introScreen');const dismiss=()=>{if(!intro||intro.classList.contains('hide'))return;intro.classList.add('hide');setTimeout(()=>intro.remove(),950)};setTimeout(dismiss,2800);intro.addEventListener('click',dismiss);})();
</script>

</head><body><main class="app"><div class="tag">TACTICAL MODE • YOU VS ROBERT</div><div class="title">TIC TAC TOE</div><p class="sub">Can you beat Robert?</p><section class="panel"><div class="score"><div class="pill">YOU<b id="youScore">0</b></div><div class="pill">DRAWS<b id="drawScore">0</b></div><div class="pill">ROBERT<b id="aiScore">0</b></div></div><div class="status" id="status" aria-live="polite">Your turn — choose a square.</div><div class="board" id="board" role="group" aria-label="Tic tac toe board"></div><div class="actions"><button class="btn primary" id="newRound">New Round</button><button class="btn secondary" id="reset">Reset Scores</button></div><div class="settings"><label for="difficulty">Robert's difficulty</label><select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="impossible">Impossible</option></select></div></section><p class="note">Best of 3 rounds: Round 1 you are X, Round 2 you are O, Round 3 you are X. Choose Easy, Medium, or Impossible. A result popup appears after each round!</p></main>
<script>
const boardEl=document.getElementById('board'),statusEl=document.getElementById('status'),difficulty=document.getElementById('difficulty');
let cells=Array(9).fill(''),ended=false,thinking=false,round=1,scores={you:0,draw:0,ai:0};
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const humanMark=()=>round===2?'O':'X', aiMark=()=>round===2?'X':'O';
function winner(b){for(const line of wins){const [a,c,d]=line;if(b[a]&&b[a]===b[c]&&b[a]===b[d])return {mark:b[a],line};}return b.every(Boolean)?{mark:'draw',line:[]}:null;}
function render(highlight=[]){boardEl.innerHTML='';cells.forEach((v,i)=>{const b=document.createElement('button');b.className='cell'+(v==='O'?' o':'')+(highlight.includes(i)?' win':'');b.textContent=v;b.setAttribute('aria-label',`Square ${i+1}${v?', '+v:''}`);b.disabled=!!v||ended||thinking;b.addEventListener('click',()=>humanMove(i));boardEl.appendChild(b);});document.getElementById('youScore').textContent=scores.you;document.getElementById('drawScore').textContent=scores.draw;document.getElementById('aiScore').textContent=scores.ai;}
function showPopup(title,message,buttonText='Next round'){const overlay=document.createElement('div');overlay.style.cssText='position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:24px;z-index:99';const box=document.createElement('div');box.style.cssText='width:min(100%,340px);background:#17243a;border:1px solid #72e3ff;border-radius:22px;padding:26px 20px;box-shadow:0 20px 70px #0009;text-align:center;color:#f4f7ff';box.innerHTML=`<div style="font-size:42px;margin-bottom:8px">${title.includes('You win')?'🏆':title.includes('AI wins')?'🤖':'🤝'}</div><h2 style="margin:0 0 8px">${title}</h2><p style="color:#bdc9df;line-height:1.45">${message}</p><button id="popupNext" style="border:0;border-radius:12px;padding:13px 18px;font-weight:800;background:#72e3ff;color:#0b1726;width:100%">${buttonText}</button>`;overlay.appendChild(box);document.body.appendChild(overlay);box.querySelector('#popupNext').onclick=()=>{overlay.remove();if(round<3){round++;newRound();}else{round=1;scores={you:0,draw:0,ai:0};newRound();}};}
function finish(res){ended=true;let title,msg;if(res.mark===humanMark()){scores.you++;title='You win this round!';msg=`Brilliant move! You won Round ${round}.`;statusEl.textContent=title+' 🎉';}else if(res.mark===aiMark()){scores.ai++;title='Robert wins this round!';msg=`Robert won Round ${round}. Try a different strategy!`;statusEl.textContent=title;}else{scores.draw++;title='It’s a draw!';msg=`Neither player won Round ${round}.`;statusEl.textContent=title;}render(res.line);showPopup(title,msg,round<3?'Play next round':'Play again');}
function humanMove(i){if(ended||thinking||cells[i])return;cells[i]=humanMark();let res=winner(cells);if(res){finish(res);return;}thinking=true;statusEl.textContent='Robert is thinking…';render();setTimeout(()=>{const move=chooseMove();if(move!==undefined)cells[move]=aiMark();thinking=false;res=winner(cells);if(res)finish(res);else{statusEl.textContent=`Your turn — you are ${humanMark()}.`;render();}},260);}
function aiOpening(){thinking=true;statusEl.textContent=`AI (${aiMark()}) starts this round…`;render();setTimeout(()=>{const m=chooseMove();if(m!==undefined)cells[m]=aiMark();thinking=false;const res=winner(cells);if(res)finish(res);else{statusEl.textContent=`Your turn — you are ${humanMark()}.`;render();}},300);}
function chooseMove(){const level=difficulty.value,me=aiMark(),op=humanMark();if(level==='easy'){const empty=cells.map((v,i)=>v?null:i).filter(v=>v!==null);return empty[Math.floor(Math.random()*empty.length)];}if(level==='medium'){let m=findImmediate(me);if(m!==undefined)return m;m=findImmediate(op);if(m!==undefined)return m;if(!cells[4])return 4;const corners=[0,2,6,8].filter(i=>!cells[i]);if(corners.length)return corners[Math.floor(Math.random()*corners.length)];const e=cells.map((v,i)=>v?null:i).filter(v=>v!==null);return e[Math.floor(Math.random()*e.length)];}let best=-Infinity,bestMoves=[];for(let i=0;i<9;i++){if(cells[i])continue;cells[i]=me;const score=minimax(cells,false,0,me,op);cells[i]='';if(score>best){best=score;bestMoves=[i];}else if(score===best)bestMoves.push(i);}return bestMoves[Math.floor(Math.random()*bestMoves.length)];}
function minimax(b,isMax,depth,me,op){const res=winner(b);if(res){if(res.mark===me)return 10-depth;if(res.mark===op)return depth-10;return 0;}if(isMax){let best=-Infinity;for(let i=0;i<9;i++)if(!b[i]){b[i]=me;best=Math.max(best,minimax(b,false,depth+1,me,op));b[i]='';}return best;}let best=Infinity;for(let i=0;i<9;i++)if(!b[i]){b[i]=op;best=Math.min(best,minimax(b,true,depth+1,me,op));b[i]='';}return best;}
function findImmediate(mark){for(let i=0;i<9;i++)if(!cells[i]){cells[i]=mark;const r=winner(cells);cells[i]='';if(r&&r.mark===mark)return i;}return undefined;}
function newRound(){cells=Array(9).fill('');ended=false;thinking=false;document.querySelector('.sub').textContent=`ROUND ${round} OF 3 • You are ${humanMark()} • Robert is ${aiMark()}`;statusEl.textContent=`Your turn — you are ${humanMark()}.`;render();if(round===2)aiOpening();}
document.getElementById('newRound').addEventListener('click',()=>{if(round<3){round++;newRound();}else{round=1;scores={you:0,draw:0,ai:0};newRound();}});document.getElementById('reset').addEventListener('click',()=>{scores={you:0,draw:0,ai:0};round=1;newRound();});difficulty.addEventListener('change',()=>newRound());newRound();
</script></body></html>
