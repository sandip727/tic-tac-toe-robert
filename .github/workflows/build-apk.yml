name: Build Robert Tic Tac Toe APK

on:
  workflow_dispatch:
  push:
    paths:
      - "tic_tac_toe_robert_sandip_rai.html"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get game
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/sandiprai/robert
          cp tic_tac_toe_robert_sandip_rai.html app/src/main/assets/index.html
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RobertTicTacToe"
          include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.sandiprai.robert'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.sandiprai.robert'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Robert Tic Tac Toe"
                  android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/sandiprai/robert/MainActivity.java <<'EOF'
          package com.sandiprai.robert;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  WebView web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Robert-Tic-Tac-Toe-APK
          path: app/build/outputs/apk/debug/
